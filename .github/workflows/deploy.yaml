# 119 사고현장 확인(ndms-onestop): 시험 통과해야 배포 (하나라도 실패하면 배포 중단, 기존 화면 유지)
# 카카오 JavaScript 키는 저장소에 두지 않고, 배포할 때 비밀값 KAKAO_JS_KEY를 index.html에 끼워넣음
#   설정 위치: 저장소 Settings → Secrets and variables → Actions → New repository secret → 이름 KAKAO_JS_KEY
#   비밀값이 없으면 키 없이 배포(각자 앱 설정에서 입력하는 방식으로 동작)
# 배포된 화면 소스에는 키가 보임(카카오 지도는 브라우저에서 키를 쓰는 구조). 보호는 카카오의 도메인 제한으로 함
name: 시험 후 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 119 메시지 분석 (주소·사업장명·1보2보 묶기)
        run: node tests/parser_test.js
      - name: 소방 관할 찾기 (대구·경북 관할표, 리·지번 단위 예외)
        run: node tests/fire_test.js
      - name: 캐시 삭제 범위 (법ON·오늘의안전·노무길잡이 저장본 보존)
        run: node tests/check_sw_scope.js service-worker.js
      - name: 키 자리표시 (저장소에 실제 키가 들어가지 않았는지)
        run: node tests/check_key_placeholder.js index.html
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 배포 파일만 모으기 (tests·.github 제외)
        run: |
          mkdir _site
          cp index.html manifest.json service-worker.js icon-*.png _site/
      - name: 카카오 키 넣기
        env:
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
        run: |
          if [ -z "$KAKAO_JS_KEY" ]; then
            echo "::warning::비밀값 KAKAO_JS_KEY가 없어 키 없이 배포합니다(각자 앱 설정에서 입력)."
            exit 0
          fi
          if ! printf '%s' "$KAKAO_JS_KEY" | grep -Eq '^[0-9A-Fa-f]{32}$'; then
            echo "::error::KAKAO_JS_KEY 형식 오류: JavaScript 키(영문·숫자 32자)를 넣었는지 확인하세요. REST API 키와 헷갈리지 않게."
            exit 1
          fi
          sed -i "s/__KAKAO_JS_KEY__/${KAKAO_JS_KEY}/" _site/index.html
          if grep -q "__KAKAO_JS_KEY__" _site/index.html; then echo "::error::키 넣기 실패"; exit 1; fi
          echo "키를 넣었습니다."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
