<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1E2935">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사고현장">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>119 사고현장 확인</title>
<style>
:root{
  --bg:#EDF0F3; --card:#FFFFFF; --ink:#17212D; --ink2:#4B5664; --ink3:#7B8592; --line:#D6DBE1;
  --hdr:#1E2935; --hdrink:#F3F5F7; --hdrsub:#AEB8C4;
  --acc:#D3361F; --rv:#1D6ED8; --near:#1C8048; --mid:#A86A0A; --far:#C02E1A;
  --gut:16px; --tabh:64px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:1.0625rem;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--rv);outline-offset:2px}
a{color:inherit}

/* 머리 띠: 첫 화면은 앱 이름, 목록 화면은 ‹ 뒤로 */
.hdr{position:sticky;top:0;z-index:30;background:var(--hdr);color:var(--hdrink);padding-top:env(safe-area-inset-top)}
.hin{max-width:640px;margin:0 auto;height:56px;display:flex;align-items:center;gap:4px;padding:0 6px 0 var(--gut)}
.hin h1{flex:1;margin:0;font-size:1.125rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hin .back{margin-left:-10px}
.back{min-width:44px;height:44px;padding:0 10px;font-size:1rem;font-weight:600;color:inherit;border-radius:8px;white-space:nowrap}
.back:active,.ib:active{background:rgba(255,255,255,.12)}
.ib{min-width:44px;height:44px;padding:0 10px;border-radius:8px;font-size:.9375rem;font-weight:600;color:inherit;white-space:nowrap}

main{flex:1 0 auto}
.scr{max-width:640px;margin:0 auto;padding:16px var(--gut) calc(28px + env(safe-area-inset-bottom))}

/* 첫 화면 */
.lead{margin:2px 0 12px;color:var(--ink2);font-size:.9375rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;font-weight:700;font-size:1rem;text-decoration:none}
.btn.pri{background:var(--hdr);color:#fff}
.btn.pri:active{background:#2C3B4B}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.line:active,.btn.ghost:active{background:#E2E6EB}
.btn.big{width:100%;min-height:60px;font-size:1.125rem;background:var(--hdr);color:#fff}
.btn.big:active{background:#2C3B4B}
.btn[disabled]{opacity:.45}
textarea#raw{display:block;width:100%;min-height:200px;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:1rem;line-height:1.5;resize:vertical}
textarea#raw::placeholder{color:#A3ABB5}
.row{display:flex;gap:10px;margin-top:10px}
.row .btn{flex:1}
.row .btn.ghost{flex:0 0 auto}
.err{margin-top:12px;padding:12px 14px;border-radius:10px;background:#FBE9E6;color:#8A2414;font-size:.9375rem}
.note{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.9375rem;color:var(--ink2)}
.note b{color:var(--ink)}
.note.warn{background:#FFF4E0;border-color:#F0D49A;color:#6B4708}
.note .btn{margin-top:10px;min-height:42px}
.recent{margin-top:14px}
.recent h2,.sec h2{margin:0 0 6px;font-size:.875rem;font-weight:700;color:var(--ink3)}
.foot{max-width:640px;margin:0 auto;padding:0 calc(var(--gut) + 2px) calc(20px + env(safe-area-inset-bottom));font-size:.8125rem;color:var(--ink3);line-height:1.6}

/* 사고 카드(여러 건·최근) */
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.card:active{background:#F4F6F8}
.card .t{display:flex;gap:8px;align-items:baseline;font-size:.875rem;color:var(--ink2)}
.card .t b{color:var(--ink);font-size:1rem}
.card .a{margin-top:2px;font-weight:700}
.card .c{margin-top:2px;color:var(--ink2);font-size:.9375rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:.75rem;font-weight:700;background:#E4E8ED;color:var(--ink2);vertical-align:1px}
.tag.red{background:#FBE3DF;color:#9E2512}
.tag.blue{background:#E1ECFB;color:#1653A6}
.tag.green{background:#DFF2E6;color:#14653A}
.tag.amber{background:#FBEFD5;color:#7A4D06}

/* 현장 화면: 휴대폰 한 화면 고정 분할(페이지 스크롤 없음 → 지도·로드뷰 손가락 조작과 충돌 없음) */
html.indet,html.indet body{height:100%;overflow:hidden}
.det{position:fixed;inset:0;z-index:40;background:var(--hdr);display:flex;flex-direction:column;height:100%}
.det>*{width:100%;max-width:640px;margin-left:auto;margin-right:auto}
.dhdr{padding-top:env(safe-area-inset-top);color:var(--hdrink);display:flex;align-items:center;gap:2px;padding-left:4px;padding-right:6px;min-height:calc(54px + env(safe-area-inset-top))}
.dadr{flex:1;min-width:0;padding:6px 4px;line-height:1.3}
.dadr b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:1.0625rem;line-height:1.3}
.dadr span{display:block;font-size:.8125rem;color:var(--hdrsub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dline{color:#D5DCE4;font-size:.875rem;padding:0 var(--gut) 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dline .tag{margin-right:4px}
.dmaps{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.pane{position:relative;flex:1 1 0;min-height:0;background:#D9DEE4;overflow:hidden;transition:flex-grow .2s}
.pane>.mapbox{position:absolute;inset:0}
.dmaps.bigmap #mapWrap,.dmaps.bigrv #rvWrap{flex-grow:2.3}
.dmaps.norv #rvWrap{flex:0 0 auto;min-height:0}
.dmaps.norv #rvWrap .mapbox,.dmaps.norv #rvWrap .ptools{display:none}
.ptools{position:absolute;top:8px;right:8px;z-index:5;display:flex;gap:6px}
.ptools button{height:36px;padding:0 11px;border-radius:8px;background:rgba(255,255,255,.94);color:var(--ink);font-size:.8125rem;font-weight:700;border:1px solid rgba(0,0,0,.08)}
.ptools button[aria-pressed="true"]{background:var(--hdr);color:#fff}
.pmsg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:4;padding:0 20px;text-align:center;color:var(--ink2);font-size:.9375rem}
.dmaps.norv #rvWrap .pmsg{position:static;transform:none;padding:12px 16px;text-align:left;background:var(--card)}
.pmsg .btn{margin-top:10px;min-height:42px}

/* 지도와 로드뷰 사이 띠: 사고지점과 로드뷰 촬영지점 거리 */
.hinge{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px var(--gut) 8px;--hc:var(--ink3)}
.hinge[data-lv="near"]{--hc:var(--near)} .hinge[data-lv="mid"]{--hc:var(--mid)} .hinge[data-lv="far"]{--hc:var(--far)}
.hrow{display:flex;align-items:center;gap:8px;font-size:.8125rem;font-weight:700;color:var(--ink2);white-space:nowrap}
.hrow .hl{flex:1;height:0;border-top:2px dashed var(--hc);opacity:.75}
.hrow .hd{flex:0 0 auto;font-size:1.125rem;color:var(--hc);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.dot.acc{background:var(--acc);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--acc)}
.dot.rv{background:#fff;border:3px solid var(--rv)}
.hnote{margin-top:2px;font-size:.8125rem;color:var(--hc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 지도 위 표시 */
.mk{position:relative;width:0;height:0}
.mk i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%}
.mk.acc i{background:var(--acc);box-shadow:0 0 0 3px #fff,0 0 0 4px var(--acc),0 2px 6px rgba(0,0,0,.35)}
.mk.acc span{position:absolute;left:14px;top:-12px;padding:1px 6px;border-radius:5px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.mk.rvm i{left:-8px;top:-8px;width:16px;height:16px;background:#fff;border:4px solid var(--rv);box-shadow:0 2px 6px rgba(0,0,0,.3)}

/* 아래 버튼 줄 */
.dbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.dbar button,.dbar a{min-height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8125rem;font-weight:700;color:var(--ink);text-decoration:none;text-align:center;padding:4px 2px;line-height:1.25}
.dbar button:active,.dbar a:active{background:#EEF1F4}
.dbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dbar .hot{color:var(--acc)}

/* 아래에서 올라오는 창 */
.sheet{position:fixed;inset:0;z-index:50}
.shbg{position:absolute;inset:0;background:rgba(14,20,28,.5)}
.shcard{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:88%;overflow-y:auto;overscroll-behavior:contain;background:var(--card);border-radius:14px 14px 0 0;padding:0 var(--gut) calc(22px + env(safe-area-inset-bottom))}
.shh{position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px;border-bottom:1px solid var(--line)}
.shh h2{margin:0;font-size:1.125rem}
.shh .ib{color:var(--ink2)}
.shh .ib:active{background:#EEF1F4}
.sec{margin-top:16px}
dl.kv{margin:0;display:grid;grid-template-columns:5.6em 1fr;gap:7px 10px;font-size:.9375rem}
dl.kv dt{color:var(--ink3)}
dl.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips .btn{min-height:40px;padding:0 14px;font-size:.875rem}
.coord{font-variant-numeric:tabular-nums}
.pre{white-space:pre-wrap;background:#F4F6F8;border-radius:8px;padding:10px 12px;font-size:.875rem;color:var(--ink2);margin:8px 0 0}
.lbl{display:block;font-weight:700;margin:14px 0 6px}
input.txt{width:100%;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:#fff}
.small{font-size:.8125rem;color:var(--ink3)}

/* 사업장 후보 */
.cand{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:10px}
.cand .n{font-weight:700}
.cand .ad{font-size:.875rem;color:var(--ink2);margin-top:2px}
.cand .acts{display:flex;gap:8px;margin-top:9px}
.cand .acts .btn{flex:1;min-height:46px;font-size:.9375rem;white-space:nowrap}
.cand .acts .btn.tel,.cand .acts .btn.ghost{flex:2.2}
.btn.tel{background:var(--near);color:#fff}
.btn.tel:active{background:#166A3B}
.empty{margin-top:10px;padding:12px;border-radius:10px;background:#F4F6F8;color:var(--ink2);font-size:.9375rem}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #C3CAD3;border-top-color:var(--ink2);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* 알림 */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);z-index:80;max-width:calc(100% - 2*var(--gut));padding:10px 16px;border-radius:8px;background:var(--ink);color:#fff;font-size:.9375rem;font-weight:600;box-shadow:0 6px 20px rgba(8,14,24,.25);text-align:center}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:79;width:calc(100% - 2*var(--gut));max-width:520px;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:10px;background:var(--ink);color:#fff;font-size:.9375rem}
.updbar span{flex:1}
.updbar button{height:40px;padding:0 14px;border-radius:8px;background:#fff;color:var(--ink);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hdr" id="hdr">
  <div class="hin">
    <button class="back" id="hBack" data-back hidden>‹ 뒤로</button>
    <h1 id="hTitle">119 사고현장 확인</h1>
    <button class="ib" id="hSet" aria-label="설정">설정</button>
  </div>
</header>

<main>
  <!-- 첫 화면: 붙여넣기 -->
  <section class="scr" id="sIn">
    <p class="lead">카카오톡으로 받은 119 상황전파 메시지를 그대로 붙여넣으세요. 여러 건을 한꺼번에 넣어도 됩니다.</p>
    <button class="btn big" id="bPaste">복사한 메시지 붙여넣고 확인</button>
    <textarea id="raw" spellcheck="false" autocomplete="off" placeholder="[부상-상황전파 1보] 구급&#10;- 발생일시 : 2026-01-05 10:20:00&#10;- 사업장명 : 파악불가&#10;- 사고위치 : ○○시 ○○동 123-4&#10;- 사고내용 : …"></textarea>
    <div class="row">
      <button class="btn ghost" id="bClear">지우기</button>
      <button class="btn pri" id="bGo">현장 확인</button>
    </div>
    <div class="err" id="inErr" hidden></div>
    <div class="note warn" id="keyWarn" hidden>
      <b>카카오 지도 키가 아직 없습니다.</b> 키를 넣기 전에는 메시지 분석과 외부 지도 열기만 됩니다.
      <div><button class="btn pri" data-open-set>키 넣기</button></div>
    </div>
    <div class="recent" id="recent" hidden></div>
    <div class="note" id="inst" hidden></div>
  </section>

  <!-- 여러 건일 때 목록 -->
  <section class="scr" id="sList" hidden>
    <p class="lead" id="listLead"></p>
    <div id="listBody"></div>
  </section>
</main>
<div class="foot" id="foot">메시지 분석은 이 휴대폰 안에서만 합니다. 카카오 지도에는 주소·좌표·검색어만 보냅니다.</div>

<!-- 현장 화면 -->
<section class="det" id="sDet" hidden aria-label="사고현장">
  <div class="dhdr">
    <button class="back" data-back aria-label="뒤로">‹ 뒤로</button>
    <div class="dadr"><b id="dAddr"></b><span id="dSub"></span></div>
    <button class="ib" id="dCopy">주소복사</button>
  </div>
  <div class="dline" id="dLine"></div>
  <div class="dmaps" id="dMaps">
    <div class="pane" id="mapWrap">
      <div class="mapbox" id="map"></div>
      <div class="ptools">
        <button id="mType" aria-pressed="false">위성</button>
        <button id="mBig" aria-pressed="false">지도 크게</button>
      </div>
      <div class="pmsg" id="mapMsg"></div>
    </div>
    <div class="hinge" id="hinge">
      <div class="hrow"><span><i class="dot acc"></i>사고지점</span><span class="hl"></span><b class="hd" id="dist">…</b><span class="hl"></span><span><i class="dot rv"></i>로드뷰</span></div>
      <div class="hnote" id="hnote">위치를 찾는 중입니다</div>
    </div>
    <div class="pane" id="rvWrap">
      <div class="mapbox" id="rv"></div>
      <div class="ptools">
        <button id="rvAim">사고지점 쪽 보기</button>
        <button id="rvBig" aria-pressed="false">로드뷰 크게</button>
      </div>
      <div class="pmsg" id="rvMsg"></div>
    </div>
  </div>
  <nav class="dbar">
    <button id="bInfo"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>사고정보·보고</button>
    <button id="bBiz" class="hot"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>사업장 찾기</button>
    <a id="lKakao" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>카카오맵</a>
    <a id="lNaver"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>네이버지도</a>
  </nav>
</section>

<!-- 사고정보·보고 -->
<div class="sheet" id="shInfo" hidden role="dialog" aria-label="사고정보">
  <div class="shbg" data-back></div>
  <div class="shcard"><div class="shh"><h2>사고정보</h2><button class="ib" data-back>닫기</button></div><div id="infoBody"></div></div>
</div>
<!-- 사업장 찾기 -->
<div class="sheet" id="shBiz" hidden role="dialog" aria-label="사업장 찾기">
  <div class="shbg" data-back></div>
  <div class="shcard"><div class="shh"><h2>사업장 찾기</h2><button class="ib" data-back>닫기</button></div><div id="bizBody"></div></div>
</div>
<!-- 설정 -->
<div class="sheet" id="shSet" hidden role="dialog" aria-label="설정">
  <div class="shbg" data-back></div>
  <div class="shcard"><div class="shh"><h2>설정</h2><button class="ib" data-back>닫기</button></div><div id="setBody"></div></div>
</div>

<div class="toast" id="toast" hidden role="status"></div>
<div class="updbar" id="updbar" hidden><span>새 버전이 있습니다.</span><button id="bUpd">새로 열기</button></div>

<script id="parser">
// ===== PARSER-START: 119 상황전파 메시지 분석(이 휴대폰 안에서만 처리, 외부 전송 없음) =====
(function (root) {
  'use strict';
  var KEY_ALIAS = { '발생일시': '발생일시', '발생시간': '발생일시', '발생시각': '발생일시', '일시': '발생일시', '신고일시': '발생일시',
    '사업장명': '사업장명', '사업장': '사업장명', '업체명': '사업장명', '상호': '사업장명',
    '사고위치': '사고위치', '사고장소': '사고위치', '발생장소': '사고위치', '발생위치': '사고위치', '위치': '사고위치', '주소': '사고위치',
    '사고내용': '사고내용', '내용': '사고내용', '사고개요': '사고내용',

  var REGION = [['서울특별시','서울'],['부산광역시','부산'],['대구광역시','대구'],['인천광역시','인천'],['광주광역시','광주'],['대전광역시','대전'],['울산광역시','울산'],['세종특별자치시','세종'],['경기도','경기'],['강원특별자치도','강원'],['강원도','강원'],['충청북도','충북'],['충청남도','충남'],['전북특별자치도','전북'],['전라북도','전북'],['전라남도','전남'],['경상북도','경북'],['경상남도','경남'],['제주특별자치도','제주']];

  function norm(t) {

  // 여러 건 붙여넣기 → 머리말 [ … ] 기준으로 나눔

    else if (/㈜|\(주\)|주식회사|유한회사|관리사무소|관리소|공사$/.test(raw)) type = 'company';

<script>
(function () {

    L.push('- 피해현황: ' + (x.damage || '🔵 확인 필요'));
    L.push('- 119 기재 사업장명: ' + (x.biz.type === 'none' ? (x.biz.raw || '없음') : x.biz.raw));
    L.push('- 확인사업장: 🔵 확인 필요');
    L.push('- 사업장 연락처: 🔵 확인 필요');
    L.push('- 좌표: ' + (loc ? loc.lat.toFixed(6) + ', ' + loc.lng.toFixed(6) + (loc.precise ? '' : ' (🔵 위치 정확도 낮음)') : '🔵 확인 필요'));
    L.push('- 확인사항: 🔵 확인 결과 입력');
    return L.join('\n');
  }
  function renderInfo() {
    var x = current; if (!x) return;
    var d = x.det, sub = [];
    if (d.height) sub.push('높이 ' + d.height);
    if (d.cons) sub.push(d.cons);
    if (d.person) sub.push(d.person);
    if (d.foreign) sub.push('외국인');
    if (d.cpr) sub.push('심정지·CPR 언급');
    var h = '<div class="sec"><dl class="kv">' +
      '<dt>발생일시</dt><dd>' + esc(x.date.disp || '없음') + '</dd>' +
      '<dt>유형</dt><dd>' + esc((x.header.kind || '') + (x.header.disp ? ' / ' + x.header.disp : '')) + (x.nos && x.nos.length ? ' <span class="tag">' + x.nos.join('·') + '보</span>' : '') + (x.traffic ? ' <span class="tag amber">교통사고로 보임</span>' : '') + '</dd>' +
      '<dt>사업장명</dt><dd>' + esc(x.biz.raw || '없음') + ' <span class="tag">' + ({ none: '미기재', company: '업체명', place: '건물명', site: '건설현장', unknown: '종류 불명' })[x.biz.type] + '</span></dd>' +
      '<dt>사고내용</dt><dd>' + esc(x.content || '없음') + (sub.length ? '<div class="small">' + esc(sub.join(' / ')) + '</div>' : '') + '</dd>' +
      (x.etc ? '<dt>기타사항</dt><dd>' + esc(x.etc) + '</dd>' : '') +
      '<dt>피해현황</dt><dd>' + esc(x.damage || '없음') + '</dd>' +
      '<dt>기상</dt><dd>' + esc(x.weather.items.length ? x.weather.items.map(function (w) { return w[0] + ' ' + w[1]; }).join(', ') : (x.weather.raw || '없음')) + '</dd>' +
      '</dl></div>';
    h += '<div class="sec"><h2>위치</h2><dl class="kv">' +
      '<dt>119 원문</dt><dd>' + esc(x.addr.raw) + (x.addr.notes.length ? '<div class="small">메모: ' + esc(x.addr.notes.join(', ')) + '</div>' : '') + '</dd>' +
      '<dt>지번</dt><dd>' + esc(loc && loc.jibun || '확인 전') + '</dd>' +
      '<dt>도로명</dt><dd>' + esc(loc && loc.road || (loc ? '없음' : '확인 전')) + '</dd>' +
      '<dt>좌표</dt><dd class="coord">' + (loc ? loc.lat.toFixed(6) + ', ' + loc.lng.toFixed(6) : '확인 전') + '</dd>' +
      (loc && loc.how ? '<dt>정확도</dt><dd><span class="tag amber">주의</span> ' + esc(loc.how) + '</dd>' : '') +
      (rvPos && accPos ? '<dt>로드뷰</dt><dd>사고지점에서 ' + Math.round(haversine(accPos, rvPos)) + 'm 떨어진 곳에서 촬영</dd>' : '') +
      '</dl><div class="chips">' +
      '<button class="btn line" data-cp="addr">주소복사</button>' +
      (loc ? '<button class="btn line" data-cp="coord">좌표복사</button>' : '') +
      '<a class="btn line" target="_blank" rel="noopener" href="' + (loc ? 'https://map.kakao.com/link/roadview/' + loc.lat + ',' + loc.lng : 'https://map.kakao.com/link/search/' + encodeURIComponent(x.addr.clean)) + '">카카오 로드뷰 앱으로</a>' +
      '</div></div>';
    h += '<div class="sec"><h2>보고용 내용</h2><div class="pre" id="repPre">' + esc(reportText(x)) + '</div>' +
      '<div class="chips"><button class="btn pri" data-cp="rep">보고용 내용 복사</button><button class="btn line" data-cp="raw">119 원문 복사</button></div></div>';
    $('infoBody').innerHTML = h;
  }
  $('bInfo').addEventListener('click', function () { renderInfo(); open('shInfo'); $('shInfo').querySelector('.shcard').scrollTop = 0; });
  $('infoBody').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cp]'); if (!b || !current) return;
    var k = b.getAttribute('data-cp');
    if (k === 'addr') copy((loc && loc.jibun) || current.addr.clean, '주소를 복사했습니다');
    else if (k === 'coord' && loc) copy(loc.lat.toFixed(6) + ', ' + loc.lng.toFixed(6), '좌표를 복사했습니다');
    else if (k === 'rep') copy(reportText(current), '보고용 내용을 복사했습니다');
    else if (k === 'raw') copy(current.raw, '원문을 복사했습니다');
  });

  // ── 사업장 찾기(자동확정 안 함: 모두 '후보') ──
  var TYPE_GUIDE = {
    company: function (x) { return '<b>119 기재 사업장: ' + esc(x.biz.raw) + '</b><br>같은 이름의 장소를 사고지점 주변에서 찾았습니다. 이름이 같아도 다른 곳일 수 있으니 전화로 확인하세요.'; },
    unknown: function (x) { return '<b>119 기재 이름: ' + esc(x.biz.raw) + '</b><br>업체명인지 건물명인지 구분되지 않아 이름 그대로 찾았습니다.'; },
    place: function (x) { return '<b>' + esc(x.biz.raw) + '</b>는 사고가 난 <b>건물</b>입니다. 실제 사업주(관리사무소, 공사·용역업체, 세대 인테리어업체 등)는 따로 확인해야 합니다. 공사업체를 아는 경우가 많은 <b>관리사무소</b>를 먼저 찾았습니다.'; },
    site: function (x) { return '<b>' + esc(x.biz.raw) + '</b>는 건설현장명입니다. 시공사(원청) 확인이 필요합니다. 현장명으로 찾은 결과입니다.'; },
    none: function () { return '사업장명이 없습니다(파악불가). <b>사고 주소에 등록된 장소</b>를 찾아봅니다. 공장·작업장은 지도에 없는 경우가 많아 비어 있을 수 있습니다. 비어 있으면 네이버지도의 \'이 주소의 장소\'로 확인하세요.'; }
  };
  function bizQueries(x) {
    var b = x.biz, qs = [];
    if (b.type === 'place') { qs.push({ q: b.q + ' 관리사무소', r: 1500, label: '관리사무소' }); qs.push({ q: b.q, r: 800, label: '건물' }); }
    else if (b.type === 'site') { qs.push({ q: b.q, r: 3000, label: '현장명' }); var first = b.q.split(' ')[0]; if (first && first !== b.q) qs.push({ q: first, r: 3000, label: '업체명' }); }
    else if (b.type === 'company' || b.type === 'unknown') { qs.push({ q: b.q, r: 5000, label: '이름' }); }
    else { if (loc && loc.jibun) qs.push({ q: loc.jibun, r: 300, label: '주소', addrOnly: true }); if (loc && loc.road) qs.push({ q: loc.road, r: 300, label: '도로명주소', addrOnly: true }); }
    return qs;
  }
  var ML = { exact: ['green', '주소 일치'], road: ['green', '도로명 일치'], lot: ['blue', '같은 번지(본번)'] };
  function candHTML(p) {
    var d = Math.round(+p.distance || 0);
    var lv = ML[p._m];
    var tel = (p.phone || '').replace(/[^\d-]/g, '');
    return '<div class="cand"><div class="n">' + esc(p.place_name) + ' ' + (lv ? '<span class="tag ' + lv[0] + '">' + lv[1] + '</span>' : '<span class="tag">사고지점에서 약 ' + (d >= 1000 ? (d / 1000).toFixed(1) + 'km' : d + 'm') + '</span>') + '</div>' +
      '<div class="ad">' + esc(p.address_name || '') + (p.road_address_name ? ' / ' + esc(p.road_address_name) : '') + (p.category_name ? '<br>' + esc(p.category_name) : '') + '</div>' +
      '<div class="acts">' + (tel ? '<a class="btn tel" href="tel:' + tel + '">☎ ' + esc(p.phone) + '</a>' : '<span class="btn ghost" aria-disabled="true">전화번호 없음</span>') +
      (p.place_url ? '<a class="btn line" target="_blank" rel="noopener" href="' + esc(p.place_url) + '">상세</a>' : '') + '</div></div>';
  }
  function renderBiz() {
    var x = current; if (!x) return;
    var el = $('bizBody');
    var ext = function (q) { return '<a class="btn line" href="' + esc(naverWeb(q)) + '" data-naver="' + esc(q) + '">네이버지도: ' + esc(q) + '</a>'; };
    var addrQ = (loc && loc.jibun) || x.addr.clean;
    var h = (x.traffic ? '<div class="note warn" style="margin-top:14px"><b>도로 위 교통사고로 보입니다.</b> 주소 주변 업체가 사고 사업장일 가능성은 낮습니다. 차량 소속은 119 상황실에 확인하세요.</div>' : '') +
      '<div class="note" style="margin-top:14px">' + TYPE_GUIDE[x.biz.type](x) + '</div>';
    var qs = bizQueries(x);
    if (!getKey() || !places || !loc) {
      h += '<div class="empty">' + (!getKey() ? '카카오 지도 키가 없어 자동으로 찾을 수 없습니다.' : '사고 위치를 확인하지 못해 자동으로 찾을 수 없습니다.') + ' 아래 버튼으로 직접 찾으세요.</div>';
    } else h += '<div id="bizRes"><div class="empty"><span class="spin"></span>찾는 중</div></div>';
    h += '<div class="sec"><h2>직접 확인</h2><div class="chips">' + ext(addrQ) + (x.biz.type !== 'none' ? ext(x.biz.q + (x.biz.type === 'place' ? ' 관리사무소' : '')) : '') + '</div></div>';
    h += '<div class="sec"><p class="small">지도 검색 결과는 참고용 후보입니다. 사업장 확정은 전화 등으로 직접 확인한 뒤 판단하세요. 관할 상황실 전화 버튼은 다음 단계에서 추가됩니다.</p></div>';
    el.innerHTML = h;
    if (!getKey() || !places || !loc) return;
    if (bizCache) { $('bizRes').innerHTML = bizCache; return; }
    var my = runId, center = new K.LatLng(loc.lat, loc.lng);
    Promise.all(qs.map(function (q) { return kwSearch(q.q, { location: center, radius: q.r, sort: kakao.maps.services.SortBy.DISTANCE }).then(function (r) { return { q: q, r: r }; }); })).then(function (rs) {
      if (my !== runId) return;
      var seen = {}, out = '';
      rs.forEach(function (g) {
        var list = g.r.filter(function (p) { if (seen[p.id]) return false; seen[p.id] = 1; p._m = P.matchLevel(p.address_name, p.road_address_name, loc.jibun, loc.road); return g.q.addrOnly ? !!p._m : true; });
        list.sort(function (a, b) { var o = { exact: 0, road: 0, lot: 1 }; var ra = a._m ? o[a._m] : 2, rb = b._m ? o[b._m] : 2; return ra - rb || (+a.distance - +b.distance); });
        out += '<div class="sec"><h2>' + esc(g.q.label) + '(으)로 찾은 후보: \'' + esc(g.q.q) + '\'</h2>' + (list.length ? list.slice(0, 6).map(candHTML).join('') : '<div class="empty">찾은 곳이 없습니다.</div>') + '</div>';
      });
      if (!qs.length) out = '<div class="empty">찾을 검색어가 없습니다.</div>';
      if (kakaoErr) out = '<div class="note warn" style="margin-top:14px">카카오 검색이 오류를 돌려줬습니다(사용량 초과 가능성). 결과가 비어 있어도 해당 장소가 없다는 뜻은 아닙니다.</div>' + out;
      bizCache = out; var r = $('bizRes'); if (r) r.innerHTML = out;
    });
  }
  $('bBiz').addEventListener('click', function () { renderBiz(); open('shBiz'); $('shBiz').querySelector('.shcard').scrollTop = 0; });

  // ── 설정 ──
  function openSettings() {
    var k = ownKey(), d = defaultKey();
    var state = k ? '<span class="tag blue">개인 키 사용 중</span>' : d ? '<span class="tag green">기본 키 사용 중</span> 따로 넣을 필요 없습니다.' : '<span class="tag amber">키 없음</span> 지도를 쓰려면 키를 넣으세요.';
    $('setBody').innerHTML =
      '<label class="lbl" for="kKey">카카오 JavaScript 키</label>' +
      '<p class="small" style="margin:0 0 8px">' + state + '</p>' +
      '<input class="txt" id="kKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + (d ? '비워 두면 기본 키 사용' : '카카오 Developers의 JavaScript 키') + '" value="' + esc(k) + '">' +
      '<p class="small">개인 키는 이 휴대폰에만 저장되고 기본 키보다 우선합니다. 카카오 Developers의 [앱] &gt; [플랫폼 키] &gt; [JavaScript 키] &gt; [JavaScript SDK 도메인]에 아래 사이트 주소가 등록돼 있어야 지도가 열립니다.</p>' +
      '<div class="pre">' + esc(location.origin) + '</div>' +
      '<div class="chips"><button class="btn pri" id="kSave">저장</button>' + (k ? '<button class="btn ghost" id="kDel">' + (d ? '개인 키 지우기(기본 키로)' : '키 지우기') + '</button>' : '') + '</div>' +
      '<div class="sec"><h2>이 휴대폰에 저장된 것</h2><p class="small">개인 카카오 키(넣은 경우), 최근 확인한 사고의 일시·유형·위치·사업장명(24시간 지나면 표시 안 함). 사고내용·피해현황은 저장하지 않습니다. 서버로 보내는 저장은 없습니다.</p>' +
      '<div class="chips"><button class="btn line" id="kForget">최근 기록 지우기</button></div></div>' +
      '<div class="sec"><p class="small">버전 1단계 시험판 (2026.10.04)</p></div>';
    open('shSet');
  }
  $('hSet').addEventListener('click', openSettings);
  $('setBody').addEventListener('click', function (e) {
    var t = e.target;
    if (t.id === 'kSave') {
      var v = $('kKey').value.trim();
      if (v && !/^[0-9a-f]{32}$/i.test(v)) { toast('JavaScript 키는 영문·숫자 32자입니다', 2600); return; }
      if (v && v === defaultKey()) v = '';   // 기본 키와 같으면 따로 저장하지 않음
      var had = !!(window.kakao && kakao.maps); lsSet('kakaoKey', v || null); updKeyWarn();
      toast(v ? '저장했습니다' : (defaultKey() ? '기본 키를 사용합니다' : '키를 지웠습니다'));
      if (had) setTimeout(function () { location.reload(); }, 600); else back();
    } else if (t.id === 'kDel') { lsSet('kakaoKey', null); updKeyWarn(); toast(defaultKey() ? '기본 키로 돌아갑니다' : '키를 지웠습니다'); setTimeout(function () { location.reload(); }, 600); }
    else if (t.id === 'kForget') { lsSet('last', null); renderRecent(); toast('지웠습니다'); }
  });
  function updKeyWarn() { $('keyWarn').hidden = !!getKey(); }

  // ── 설치 안내(안드로이드: 설치 창 / 아이폰: 공유 → 홈 화면에 추가) ──
  var instEv = null;
  function isApp() { try { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; } catch (e) { return false; } }
  function renderInstall() {
    var el = $('inst'); if (isApp() || lsGet('instHide') === '1') { el.hidden = true; return; }
    if (instEv) el.innerHTML = '<b>홈 화면에 앱으로 설치</b>하면 주소창 없이 바로 열립니다.<div class="chips"><button class="btn pri" id="bInst">설치</button><button class="btn ghost" id="bInstNo">닫기</button></div>';
    else if (IOS) el.innerHTML = '<b>아이폰 설치:</b> Safari 아래 공유 버튼 → <b>홈 화면에 추가</b>.<div class="chips"><button class="btn ghost" id="bInstNo">닫기</button></div>';
    else { el.hidden = true; return; }
    el.hidden = false;
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); instEv = e; renderInstall(); });
  window.addEventListener('appinstalled', function () { instEv = null; renderInstall(); });
  $('inst').addEventListener('click', function (e) {
    if (e.target.id === 'bInst' && instEv) { instEv.prompt(); var d = function () { instEv = null; renderInstall(); }; instEv.userChoice ? instEv.userChoice.then(d, d) : d(); }
    else if (e.target.id === 'bInstNo') { lsSet('instHide', '1'); renderInstall(); }
  });

  // ── 자동 업데이트: 새 버전을 받으면 안내 띠 ──
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./service-worker.js').catch(function () {});
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'ONESTOP_UPDATED') {
        if (!layers.length && !$('raw').value.trim()) location.reload(); else $('updbar').hidden = false;
      }
    });
  }
  $('bUpd').addEventListener('click', function () { location.reload(); });

  // ── 시작: 공유(안드로이드)·단축어(아이폰)로 받은 글(?text=) 바로 분석 ──
  updKeyWarn(); renderRecent(); renderInstall();
  try {
    var sp = new URLSearchParams(location.search);
    var inText = [sp.get('title'), sp.get('text'), sp.get('t'), sp.get('url')].filter(Boolean).join('\n');
    if (inText) {
      history.replaceState(null, '', location.pathname);
      $('raw').value = inText.trim();
      setTimeout(function () { run(inText, false); }, 0);
    }
  } catch (e) {}
})();
</script>
